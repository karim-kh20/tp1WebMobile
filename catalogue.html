<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Rent - Catalogue dynamique</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css">
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">Auto Rent</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Accueil</a>
                <a class="nav-link active" href="catalogue.html">Catalogue CSV</a>
                <a class="nav-link" href="contact.html">Contact</a>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <h2 class="text-center mb-4">Catalogue Complet (50 Véhicules)</h2>
        <div class="table-responsive">
            <table id="dynamicTable" class="table table-striped table-hover align-middle border">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Catégorie</th>
                        <th>Marque</th>
                        <th>Modèle</th>
                        <th>Puissance</th>
                        <th>Prix / jour (DT)</th>
                        <th>Disponibilité</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Inséré dynamiquement par JavaScript -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- jQuery, DataTables & PapaParse (pour lire le CSV) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>

    <script>
        $(document).ready(function () {
            // Lecture du fichier CSV avec PapaParse
            Papa.parse("data/vehicles.csv", {
                download: true,
                header: true,
                complete: function (results) {
                    var rows = [];
                    results.data.forEach(function (item) {
                        if (item.id) {
                            var badge = item.available === "true" 
                                ? '<span class="badge bg-success">Disponible</span>' 
                                : '<span class="badge bg-danger">Loué</span>';
                            rows.push([
                                item.id,
                                item.category,
                                item.brand,
                                item.model,
                                item.power + " CV",
                                item.pricePerDay,
                                badge
                            ]);
                        }
                    });

                    // Initialisation de DataTable avec les données du CSV
                    $('#dynamicTable').DataTable({
                        data: rows,
                        language: {
                            url: 'https://cdn.datatables.net/plug-ins/1.13.7/i18n/fr-FR.json'
                        },
                        pageLength: 10
                    });
                }
            });
        });
    </script>
</body>
</html>
