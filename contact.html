<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Rent - Contact</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">Auto Rent</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Accueil</a>
                <a class="nav-link" href="catalogue.html">Catalogue CSV</a>
                <a class="nav-link active" href="contact.html">Contact</a>
            </div>
        </div>
    </nav>

    <main class="container my-5" style="max-width: 600px;">
        <h2 class="text-center mb-4">Contactez-nous</h2>
        <div class="card shadow-sm p-4">
            <form id="contactForm">
                <div class="mb-3">
                    <label for="contactNom" class="form-label">Nom et prénom :</label>
                    <input type="text" id="contactNom" class="form-control">
                </div>
                <div class="mb-3">
                    <label for="contactEmail" class="form-label">Email :</label>
                    <input type="email" id="contactEmail" class="form-control">
                </div>
                <div class="mb-3">
                    <label for="contactTel" class="form-label">Téléphone :</label>
                    <input type="tel" id="contactTel" class="form-control">
                </div>
                <div class="mb-3">
                    <label for="contactSujet" class="form-label">Sujet :</label>
                    <input type="text" id="contactSujet" class="form-control">
                </div>
                <div class="mb-3">
                    <label for="contactMessage" class="form-label">Message :</label>
                    <textarea id="contactMessage" rows="4" class="form-control"></textarea>
                </div>
                <button type="submit" class="btn btn-primary w-100">Envoyer</button>
                <p id="contactFeedback" class="mt-3 text-center fw-semibold"></p>
            </form>
        </div>
    </main>

    <script>
        document.getElementById("contactForm").addEventListener("submit", function (e) {
            e.preventDefault();
            var nom = document.getElementById("contactNom").value.trim();
            var email = document.getElementById("contactEmail").value.trim();
            var tel = document.getElementById("contactTel").value.trim();
            var sujet = document.getElementById("contactSujet").value.trim();
            var msg = document.getElementById("contactMessage").value.trim();
            var feedback = document.getElementById("contactFeedback");

            if (!nom || !email || !tel || !sujet || !msg) {
                feedback.className = "mt-3 text-center fw-semibold text-danger";
                feedback.textContent = "Veuillez remplir tous les champs du formulaire.";
                return;
            }

            feedback.className = "mt-3 text-center fw-semibold text-success";
            feedback.textContent = "Votre message a été envoyé avec succès !";
            document.getElementById("contactForm").reset();
        });
    </script>
</body>
</html>
