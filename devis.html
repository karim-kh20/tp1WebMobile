<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Rent - Devis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @media print {
            body { background: white; }
            .no-print { display: none !important; }
            .card { border: none !important; box-shadow: none !important; }
        }
    </style>
</head>
<body>

    <main class="container my-5" style="max-width: 700px;">
        <div class="card shadow p-4">
            <div class="text-center mb-4">
                <h1 class="fw-bold">AUTO RENT</h1>
                <p class="text-muted">DEVIS DE LOCATION</p>
            </div>
            <hr>
            <div class="row mb-3">
                <div class="col-6">
                    <h5 class="text-secondary">Client :</h5>
                    <p id="devisClient" class="fw-bold mb-1">-</p>
                    <p id="devisEmail" class="text-muted mb-1">-</p>
                    <p id="devisTel" class="text-muted">-</p>
                </div>
                <div class="col-6 text-end">
                    <h5 class="text-secondary">Détails :</h5>
                    <p class="mb-1">Date d'édition : <span id="devisDateEdition">-</span></p>
                </div>
            </div>

            <table class="table table-bordered my-4">
                <thead class="table-light">
                    <tr>
                        <th>Description du Véhicule</th>
                        <th>Du / Au</th>
                        <th>Durée</th>
                        <th>Prix / Jour</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>
                            <span id="devisVoiture" class="fw-bold">-</span><br>
                            <small class="text-muted">Catégorie : <span id="devisCategorie">-</span></small>
                        </td>
                        <td><span id="devisPeriode">-</span></td>
                        <td><span id="devisJours">-</span> jour(s)</td>
                        <td><span id="devisPrixJour">-</span> DT</td>
                        <td class="fw-bold text-success"><span id="devisTotal">-</span> DT</td>
                    </tr>
                </tbody>
            </table>

            <div class="d-flex justify-content-between mt-4 no-print">
                <a href="index.html#reservation" class="btn btn-secondary">Retour</a>
                <button onclick="window.print()" class="btn btn-success">Imprimer le devis</button>
            </div>
        </div>
    </main>

    <script>
        // Récupération des données simulées stockées dans localStorage (ou URL params)
        // Pour les besoins du TP, vous pouvez passer les données via sessionStorage depuis index.html
        document.getElementById("devisDateEdition").textContent = new Date().toLocaleDateString();
        
        // Exemple de récupération dynamique si stocké lors de la validation :
        document.getElementById("devisClient").textContent = sessionStorage.getItem("clientNom") || "Client Test";
        document.getElementById("devisEmail").textContent = sessionStorage.getItem("clientEmail") || "client@email.com";
        document.getElementById("devisTel").textContent = sessionStorage.getItem("clientTel") || "+216 00 000 000";
        document.getElementById("devisVoiture").textContent = sessionStorage.getItem("voitureNom") || "Renault Clio";
        document.getElementById("devisCategorie").textContent = sessionStorage.getItem("categorieNom") || "Citadine";
        document.getElementById("devisPeriode").textContent = (sessionStorage.getItem("dateDebut") || "-") + " au " + (sessionStorage.getItem("dateFin") || "-");
        document.getElementById("devisJours").textContent = sessionStorage.getItem("nombreJours") || "1";
        document.getElementById("devisPrixJour").textContent = sessionStorage.getItem("prixJour") || "120";
        document.getElementById("devisTotal").textContent = sessionStorage.getItem("prixTotal") || "120";
    </script>
</body>
</html>
